<script>
/* Groß-/Kleinschreibung verzeihen: /Probenplan → /probenplan/, /Reservierung → /reservierung/ */
(function(){
  var base = "/Mysterious-Worlds/";
  var rest = location.pathname.replace(/^\/mysterious-worlds\/?/i, "").replace(/\/+$/, "").toLowerCase();
  var map = { "probenplan":"probenplan/", "probenplan/index.html":"probenplan/", "reservierung":"reservierung/", "reservierung/index.html":"reservierung/", "einlass":"einlass/", "tickets":"reservierung/", "karten":"reservierung/" };
  if (map[rest] !== undefined && /^\/mysterious-worlds/i.test(location.pathname)) location.replace(base + map[rest] + location.search + location.hash);
})();
</script>
</head>
