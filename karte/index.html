<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eintrittskarte · Mysterious Worlds</title>

<style>
/* Layout: eine Eintrittskarte in der Mitte des dunklen Foyers, darunter Kalender, Drucken, Ändern */
:root{--bg:#0d0a16;--ink:#fff;--muted:rgba(255,255,255,.72);--gold:#ffd97a;--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:430px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));display:grid;gap:16px}
.ticket{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 18px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;padding-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.top .k{color:var(--gold)} .top .c{color:var(--muted);letter-spacing:.1em}
.art{display:flex;justify-content:center;padding:4px 10px 0}
.titles{display:flex;flex-direction:column;align-items:center;margin-top:-6px}
.t1{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;text-transform:uppercase;letter-spacing:.02em}
.wn{margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 12px}
.cut{position:relative;height:26px;margin-top:14px}
.cut i{position:absolute;top:0;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.cut i:first-child{left:-13px}.cut i:last-child{right:-13px}
.cut b{position:absolute;left:22px;right:22px;top:12px;border-top:2px dashed rgba(255,255,255,.28)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;padding:4px 22px 0}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.val{font-size:17px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.val.big{font-size:20px}.val.sm{font-size:15px}
.qrbox{display:flex;gap:14px;align-items:center;margin:16px 22px 0;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)}
.qr{background:#fff;padding:9px;border-radius:10px;line-height:0;flex:none}
.qr svg{display:block;width:128px;height:128px}
.code{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.06em}
.qrtext{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.35;color:rgba(255,255,255,.85)}
.qrtext .pw{font-weight:700}
.hold{margin:14px 22px 0;font-size:11.5px;line-height:1.45;color:var(--muted);text-align:center}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.06em;text-transform:uppercase;color:#ff6b6b;border:5px solid #ff6b6b;border-radius:8px;padding:2px 16px;background:rgba(13,10,22,.75)}
.inbadge{align-self:center;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:#163828;color:#4fd18b;border:1px solid #4fd18b;border-radius:999px;padding:4px 12px}
.actions{display:grid;gap:10px}
.btn{font:inherit;font-weight:700;font-size:16px;border-radius:999px;padding:13px 18px;text-align:center;text-decoration:none;cursor:pointer;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff}
.btn.main{background:#b8a2ff;border-color:#b8a2ff;color:#120c33}
.tip{font-size:13px;line-height:1.45;color:var(--muted);text-align:center;margin:0}
.msg{background:#1d1830;border:1px solid #352d4d;border-radius:14px;padding:18px;line-height:1.5;text-align:center}
.msg b{display:block;font-family:var(--display);font-size:26px;text-transform:uppercase;margin-bottom:6px}
.offline{font-size:12px;color:var(--gold);text-align:center}
.load{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media print{
  body{background:#fff}.actions,.tip,footer,.offline{display:none!important}
  .wrap{padding:0;max-width:400px}
  .ticket{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cut i{background:#fff}
}
</style>
</head>
<body>
<main class="wrap">
  <div id="box" aria-live="polite"><p class="msg"><span class="load" aria-hidden="true"></span>Eintrittskarte wird geladen …</p></div>

    <button class="btn main" type="button" id="cal">In meinen Kalender</button>

    <a class="btn" id="change" href="#">Reservierung ändern oder stornieren</a>

  <p class="offline" id="offline" hidden></p>

</main>

    <div class="titles"><div class="t1">Mysterious</div><div style="${w.wstyle};line-height:1.05">Worlds</div>
      <div class="wn">Welt: <span style="color:${w.accent}">${esc(w.name)}</span></div></div>
    <div class="cut" aria-hidden="true"><i></i><b></b><i></i></div>
    <div class="grid">
      <div class="f full">${lab("Name")}<div class="val big">${esc(b.name)}</div></div>
      <div class="f">${lab(esc(wd || "Abend"))}<div class="val">${esc(datum || b.label)}</div></div>
      <div class="f">${lab("Für")}<div class="val">${esc(personen)}</div></div>
      <div class="f">${lab("Beginn · Einlass")}<div class="val sm">${esc(zeit)}</div></div>
      <div class="f">${lab("Ort")}<div class="val sm">${esc(b.ort || "Ort folgt")}</div></div>
    </div>
    <div class="qrbox"><div class="qr">${qrSvg(b.code)}</div>
      <div class="qrtext"><div class="code">${esc(b.code)}</div><div>Am Einlass QR-Code zeigen oder Namen nennen.</div>
      <div class="pw" style="color:${w.accent}">Freie Platzwahl – wer zuerst kommt, sucht zuerst aus.</div></div></div>
    ${drin ? `<div class="inbadge">✓ Eingelassen</div>` : ""}
    <p class="hold">Plätze werden bis ${Number(b.freihalten) || 15} Minuten vor Beginn freigehalten. Danach gehen nicht abgeholte Plätze an die Warteliste.</p>
    ${storniert ? `<div class="stamp" aria-hidden="true">Storniert</div>` : ""}
  </article>`;
  document.title = `Eintrittskarte ${b.code} · Mysterious Worlds`;
  $("actions").hidden = storniert; $("tip").hidden = storniert;
  $("change").href = `${SEITE}?storno=${encodeURIComponent(b.code)}&t=${encodeURIComponent(TOKEN)}`;
  $("offline").hidden = !fromCache;
  if(fromCache) $("offline").textContent = "Offline: gespeicherter Stand. Die Karte gilt trotzdem.";
  if(storniert) $("box").insertAdjacentHTML("beforeend", `<p class="msg" style="margin-top:12px"><b>Storniert</b>Diese Reservierung wurde storniert. Möchtest du doch kommen? <a href="${SEITE}" style="color:#b8a2ff">Neu reservieren</a></p>`);
  window.__ticket = b;
}
function fail(title, text){ $("box").innerHTML = `<div class="msg"><b>${esc(title)}</b>${text}</div>`; }

async function load(){
  if(!/^MW-[A-Z0-9]{5}$/.test(CODE) || !TOKEN) return fail("Link unvollständig", 'Bitte öffne die Eintrittskarte über den Button in deiner Bestätigungsmail.');
  const cached = store.get("mw-karte-" + CODE);
  if(cached) render(cached, true);
  try{
    const r = await fetch(API, { method:"POST", body: JSON.stringify({ action:"lookup", code: CODE, token: TOKEN }) });
    const b = await r.json();
    if(!b.ok){ if(!cached) fail("Nicht gefunden", esc(b.error || "Diese Eintrittskarte gibt es nicht.") + ' Bitte nutze den Link aus deiner Bestätigungsmail.'); return; }
    store.set("mw-karte-" + CODE, b); render(b, false);
  }catch(e){
    if(!cached) fail("Keine Verbindung", "Die Eintrittskarte konnte gerade nicht geladen werden. Prüfe dein Internet und versuch es nochmal.");
  }
}

/* Kalendereintrag (.ics) */
$("cal").onclick = () => {
  const b = window.__ticket; if(!b) return;
  const d = b.abend.replace(/-/g, ""), m = String(b.beginn || "").match(/(\d{1,2})[:.](\d{2})/);
  const pad = n => String(n).padStart(2, "0"), now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const t = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  let when;
  if(m){ const h = +m[1], mi = +m[2], end = new Date(2000, 0, 1, h + 2, mi);
    when = [`DTSTART;TZID=Europe/Berlin:${d}T${pad(h)}${pad(mi)}00`, `DTEND;TZID=Europe/Berlin:${d}T${pad(end.getHours())}${pad(end.getMinutes())}00`]; }
  else { const n = new Date(+b.abend.slice(0,4), +b.abend.slice(5,7)-1, +b.abend.slice(8,10)+1);
    when = [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}`]; }
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mysterious Worlds//Eintrittskarte//DE","BEGIN:VEVENT",
    `UID:${b.code}@mysterious-worlds`, `DTSTAMP:${stamp}`, ...when,
    `SUMMARY:${t("Mysterious Worlds – Musical (" + b.plaetze + " " + (b.plaetze===1?"Person":"Personen") + ")")}`,
    b.ort ? `LOCATION:${t(b.ort)}` : "",
    `DESCRIPTION:${t("Code " + b.code + ". Eintrittskarte: " + location.href + "\nPlätze werden bis " + (b.freihalten||15) + " Minuten vor Beginn freigehalten.")}`,
    "BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:Mysterious Worlds – heute!","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type:"text/calendar;charset=utf-8" })); a.download = `mysterious-worlds-${b.code}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
};
$("print").onclick = () => window.print();
load();
</script>
</body>
</html>
